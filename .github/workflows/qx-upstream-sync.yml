name: Quantumult X upstream rule sync

on:
  # Twice daily; UTC 03:23 and 15:23 (Beijing 11:23 and 23:23).
  # Avoid minute 0; GitHub may delay scheduled workflows.
  schedule:
    - cron: '23 3,15 * * *'
  # Run a first end-to-end sync when the workflow or manifest lands on main.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qx-upstream-sync.yml'
      - 'quantumultX/upstreams.json'
      - 'scripts/sync-qx-upstreams.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qx-upstream-sync
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch upstreams and prepare curated rule delta
        run: |
          node scripts/sync-qx-upstreams.mjs --apply --report "$RUNNER_TEMP/qx-sync-report.md"
          cat "$RUNNER_TEMP/qx-sync-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate every QX ruleset and sync safety check
        run: |
          node --check scripts/sync-qx-upstreams.mjs
          node --test quantumultX/tests/*.test.mjs

      - name: Open or update one review-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/qx-upstream-sync"
          git add -- quantumultX/rules/ai quantumultX/rules/services quantumultX/upstream-state.json

          # Do not create empty PRs or update bot branches without a real diff.
          if git diff --cached --quiet; then
            echo "No upstream changes to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "chore(qx): refresh curated upstream domain rules"

          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          should_push=true
          if [[ -n "$remote_sha" ]]; then
            git fetch --no-tags --depth=1 origin "$branch"
            last_author="$(git log -1 --format=%ae FETCH_HEAD)"
            if [[ "$last_author" != "41898282+github-actions[bot]@users.noreply.github.com" ]]; then
              echo "Refusing to overwrite a branch edited outside this bot." >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD^{tree})" == "$(git rev-parse FETCH_HEAD^{tree})" ]]; then
              echo "Bot branch already contains the exact desired tree."
              should_push=false
            fi
          fi

          if [[ "$should_push" == true ]]; then
            if [[ -n "$remote_sha" ]]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" \
                origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
          fi

          pr_number="$(gh pr list --base main --head "$branch" \
            --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create --base main --head "$branch" \
              --title "chore(qx): scheduled upstream rule review" \
              --body-file "$RUNNER_TEMP/qx-sync-report.md"
          elif [[ "$should_push" == true ]]; then
            gh pr edit "$pr_number" --body-file "$RUNNER_TEMP/qx-sync-report.md"
          fi
          echo "Review-only upstream PR: $branch" >> "$GITHUB_STEP_SUMMARY"
