name: Quantumult X policy failover checks

on:
  pull_request:
    paths:
      - 'quantumultX/qx-ios.conf'
      - 'quantumultX/qx-macos.conf'
      - 'quantumultX/tests/**'
      - 'quantumultX/rules/services/apple*.list'
      - 'quantumultX/rules/services/bilibili*.list'
      - 'quantumultX/rules/services/github*.list'
      - 'quantumultX/rules/ai/claude*.list'
      - 'quantumultX/rules/**/*.list'
      - 'quantumultX/upstreams.json'
      - 'quantumultX/upstream-state.json'
      - 'scripts/sync-qx-upstreams.mjs'
      - '.github/workflows/qx-upstream-sync.yml'
      - '.github/workflows/quantumultx-policy-tests.yml'
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'quantumultX/qx-ios.conf'
      - 'quantumultX/qx-macos.conf'
      - 'quantumultX/tests/**'
      - 'quantumultX/rules/services/apple*.list'
      - 'quantumultX/rules/services/bilibili*.list'
      - 'quantumultX/rules/services/github*.list'
      - 'quantumultX/rules/ai/claude*.list'
      - 'quantumultX/rules/**/*.list'
      - 'quantumultX/upstreams.json'
      - 'quantumultX/upstream-state.json'
      - 'scripts/sync-qx-upstreams.mjs'
      - '.github/workflows/qx-upstream-sync.yml'
      - '.github/workflows/quantumultx-policy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Quantumult X policy tree and failover defaults
        run: |
          node --check scripts/sync-qx-upstreams.mjs
          node --test quantumultX/tests/*.test.mjs
