# QxRuleSet: BiliBili splash-ad endpoint (experimental; OPT-IN)
# QxRuleSet-Rewrite-Version: 2026.10.09.2
# QxRuleSet-Rewrite-Updated-At: 2026-10-09T10:04:54+08:00
# Only intercepts the precise splash/show path, not all BiliBili API traffic.
# Requires a locally trusted HTTPS MITM CA for app.bilibili.com.
# Function unverified on current iOS/BiliBili versions. Review QX logs before enable.
# No JS, response-body read, membership/entitlement modification or personal data capture.
hostname = app.bilibili.com
^https?:\/\/app\.bilibili\.com/x/v2/splash/show(?:\?|$) url reject-dict
