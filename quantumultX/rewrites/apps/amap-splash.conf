# QxRuleSet: Amap splash-ad endpoint (experimental; OPT-IN)
# QxRuleSet-Rewrite-Version: 2026.10.09.2
# QxRuleSet-Rewrite-Updated-At: 2026-10-09T10:04:54+08:00
# Strictly limits to known splash_screen ad path; does not affect navigation, maps or location APIs.
# Requires a locally trusted HTTPS MITM CA for m5.amap.com and m5-zb.amap.com.
# Function unverified on current iOS/Amap versions. Review QX logs before enable.
# No JS, response-body inspection or personal data capture.
hostname = m5.amap.com, m5-zb.amap.com
^https?:\/\/m5(?:-zb)?\.amap\.com/ws/(?:aos|valueadded)/alimama/splash_screen(?:\?|$) url reject-dict
