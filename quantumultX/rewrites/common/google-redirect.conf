# QxRuleSet - Google China domain redirect (optional)
# QxRuleSet-Rewrite-Version: 2026.10.09.1
# QxRuleSet-Rewrite-Updated-At: 2026-10-09T09:55:29+08:00
# Scope: google.cn and www.google.cn ONLY.
# This is an independently maintained minimal redirect, not a fork of other authors' modules.
# To redirect HTTPS URLs, Quantumult X needs a locally trusted MITM CA and hostname coverage.
# Do not enable on devices without a verified MITM setup.
#
# No JavaScript, response-body inspection, credential collection or generic domain wildcard.

hostname = google.cn, www.google.cn
^https?:\/\/(?:www\.)?google\.cn(?::443)?(?=\/|\?|$)(.*)$ url 302 https://www.google.com$1
