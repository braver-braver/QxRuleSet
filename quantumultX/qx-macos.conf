# Quantumult X for macOS - 精简 · 高效

[general]
# 配置文件图标
profile_img_url=https://raw.githubusercontent.com/xiaomaoJT/QxScript/main/rewrite/boxJS/icon/xiaomao.png
# dns排除列表
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn,*.localnetwork.uop, github.com, ssh.github.com, raw.githubusercontent.com
# 服务器 GEO 信息显示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js
# 资源解析器
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

# 网络检查测试
network_check_url=http://apple.com
server_check_url=http://captive.apple.com/
server_check_timeout=3000
#排除路由
excluded_routes=10.0.0.0/8, 17.0.0.0/8, 24.105.30.129/32, 100.64.0.0/10, 172.16.0.0/12, 182.162.132.1/32, 185.60.112.157/32, 185.60.112.158/32, 192.168.0.0/16, 239.255.255.250/32

#ssid_suspended_list=ImmortalWrt-5G,ImmortalWrt-2.4G
#running_mode_trigger=filter, filter, ImmortalWrt-5G:all_direct, ImmortalWrt-2.4G:all_direct

#域名拦截模式
# 可选参数 loopback，no-error-no-answer，nxdomain
dns_reject_domain_behavior=loopback
# udp服务策略
# 可选参数 reject，direct
fallback_udp_policy=reject

# udp白名单 udp_whitelist全部注释则为默认全部开放 说明：https://t.me/xiaomaoJT/418
# 保守式
udp_whitelist=53, 123, 1900, 80-443
# 开放式 （MOBA、FPS游戏选择此或全部注释）
# uudp白名单 udp_whitelist81-442,444-65535


[dns]

no-ipv6

no-system

prefer-doh3

# 机场专用 DNS


# 国内域名
#server = /*.cn/223.5.5.5

server = /*.qq.com/119.29.29.29

server = /*.tencent.com/119.29.29.29

server = /*.weixin.com/119.29.29.29

server = /*.alicdn.com/223.5.5.5

server = /*.aliyun.com/223.5.5.5

server = /*.taobao.com/223.5.5.5

server = /*.tmall.com/223.5.5.5

server = /*.jd.com/119.29.29.29

server = /*.bilibili.com/119.29.29.29

server = /hdslb.com/119.29.29.29

server = /*.163.com/119.29.29.29

server = /*.netease.com/119.29.29.29

server = /*.icloud.com.cn/119.29.29.29

# 默认 DoH
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
[task_local]
# 地理位置检测器
event-interaction https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/refs/heads/master/Scripts/QuantumultX/IP-API.js, tag=地理位置检测, enabled=true
# > 节点纯净度查询
event-interaction https://ddgksf2013.top/scripts/server-info-pure.js, tag=节点纯净度查询, img-url=trash.circle.system, enabled=true

# > 策略流量查询
event-interaction https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/QuantumultX/Scripts/Check/Traffic-Check.js, tag=策略流量查询, img-url=checkmark.seal.system, enabled=true

# 流媒体解锁(new) 
event-interaction https://raw.githubusercontent.com/braver-braver/QxRuleSet/refs/heads/main/quantumultX/scripts/streaming-ui-check.js, tag=服务解锁查询, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png, enabled=true

